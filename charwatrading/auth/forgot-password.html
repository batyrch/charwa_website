<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - Charwa Trading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #151514;
            --border-color: #252523;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #6b6b6b;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --danger: #ef4444;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container { width: 100%; max-width: 420px; padding: 20px; }
        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 24px; color: var(--text-primary); }
        .logo h1 span { color: var(--accent); }
        .logo p { font-size: 14px; color: var(--text-muted); margin-top: 8px; }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block; font-size: 14px; font-weight: 500;
            color: var(--text-secondary); margin-bottom: 8px;
        }
        .form-input {
            width: 100%; padding: 12px 16px;
            background: var(--bg-primary); border: 1px solid var(--border-color);
            border-radius: 6px; color: var(--text-primary);
            font-size: 14px; font-family: inherit; transition: border-color 0.2s;
        }
        .form-input:focus { outline: none; border-color: var(--accent); }
        .btn {
            width: 100%; padding: 14px 24px;
            background: var(--accent); border: none; border-radius: 6px;
            color: var(--bg-primary); font-size: 14px; font-weight: 600;
            font-family: inherit; cursor: pointer; transition: background 0.2s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-message {
            background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger);
            color: var(--danger); padding: 12px; border-radius: 6px;
            font-size: 14px; margin-bottom: 20px; display: none;
        }
        .error-message.show { display: block; }
        .success-message {
            background: rgba(34, 197, 94, 0.1); border: 1px solid var(--accent);
            color: var(--accent); padding: 12px; border-radius: 6px;
            font-size: 14px; margin-bottom: 20px; display: none;
        }
        .success-message.show { display: block; }
        .auth-links {
            margin-top: 24px; text-align: center; font-size: 14px;
        }
        .auth-links a {
            color: var(--accent); text-decoration: none;
        }
        .auth-links a:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <h1>CHARWA <span>Trading</span></h1>
                <p data-i18n="auth.reset_subtitle">Passwort zur&uuml;cksetzen</p>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="resetForm" onsubmit="handleReset(event)">
                <div class="form-group">
                    <label class="form-label" for="email" data-i18n="auth.email">E-Mail</label>
                    <input type="email" id="email" class="form-input" placeholder="name@company.com" required autofocus>
                </div>
                <button type="submit" class="btn" id="submitBtn" data-i18n="auth.send_reset_link">Link senden</button>
            </form>

            <div class="auth-links">
                <a href="login.html" data-i18n="auth.back_to_login">&larr; Zur&uuml;ck zur Anmeldung</a>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            i18n.setLanguage(localStorage.getItem('charwa_lang') || 'de');
            i18n.updateDOM();
        });

        async function handleReset(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = '...';
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');

            try {
                await auth.resetPassword(email);
                document.getElementById('successMessage').textContent = i18n.t('auth.reset_email_sent');
                document.getElementById('successMessage').classList.add('show');
                document.getElementById('resetForm').style.display = 'none';
            } catch (error) {
                document.getElementById('errorMessage').textContent = error.message || i18n.t('auth.reset_error');
                document.getElementById('errorMessage').classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = i18n.t('auth.send_reset_link');
            }
        }
    </script>
</body>
</html>
