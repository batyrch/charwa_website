<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Charwa Trading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #151514;
            --border-color: #252523;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #6b6b6b;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --danger: #ef4444;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container { width: 100%; max-width: 420px; padding: 20px; }
        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 24px; color: var(--text-primary); }
        .logo h1 span { color: var(--accent); }
        .logo p { font-size: 14px; color: var(--text-muted); margin-top: 8px; }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block; font-size: 14px; font-weight: 500;
            color: var(--text-secondary); margin-bottom: 8px;
        }
        .form-input {
            width: 100%; padding: 12px 16px;
            background: var(--bg-primary); border: 1px solid var(--border-color);
            border-radius: 6px; color: var(--text-primary);
            font-size: 14px; font-family: inherit; transition: border-color 0.2s;
        }
        .form-input:focus { outline: none; border-color: var(--accent); }
        .btn {
            width: 100%; padding: 14px 24px;
            background: var(--accent); border: none; border-radius: 6px;
            color: var(--bg-primary); font-size: 14px; font-weight: 600;
            font-family: inherit; cursor: pointer; transition: background 0.2s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-message {
            background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger);
            color: var(--danger); padding: 12px; border-radius: 6px;
            font-size: 14px; margin-bottom: 20px; display: none;
        }
        .error-message.show { display: block; }
        .success-message {
            background: rgba(34, 197, 94, 0.1); border: 1px solid var(--accent);
            color: var(--accent); padding: 12px; border-radius: 6px;
            font-size: 14px; margin-bottom: 20px; display: none;
        }
        .success-message.show { display: block; }
        .auth-links {
            margin-top: 24px; text-align: center;
            font-size: 14px; color: var(--text-muted);
        }
        .auth-links a {
            color: var(--accent); text-decoration: none; transition: opacity 0.2s;
        }
        .auth-links a:hover { opacity: 0.8; }
        .auth-divider {
            display: block; margin: 12px 0; color: var(--text-muted);
        }
        .back-link {
            display: block; text-align: center; margin-top: 24px;
            color: var(--text-muted); font-size: 14px; text-decoration: none;
        }
        .back-link:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <h1>CHARWA <span>Trading</span></h1>
                <p data-i18n="auth.login_subtitle">Marketplace Intelligence Portal</p>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="email" data-i18n="auth.email">E-Mail</label>
                    <input type="email" id="email" class="form-input" placeholder="name@company.com" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password" data-i18n="auth.password">Passwort</label>
                    <input type="password" id="password" class="form-input" placeholder="********" required minlength="6">
                </div>
                <button type="submit" class="btn" id="submitBtn" data-i18n="auth.sign_in">Anmelden</button>
            </form>

            <div class="auth-links">
                <a href="forgot-password.html" data-i18n="auth.forgot_password">Passwort vergessen?</a>
                <span class="auth-divider">&mdash;</span>
                <span data-i18n="auth.no_account">Noch kein Konto?</span>
                <a href="register.html" data-i18n="auth.sign_up_link">Registrieren</a>
            </div>

            <a href="../index.html" class="back-link" data-i18n="auth.back_to_site">&larr; Zur&uuml;ck zur Website</a>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Init
        document.addEventListener('DOMContentLoaded', async () => {
            i18n.setLanguage(localStorage.getItem('charwa_lang') || 'de');
            i18n.updateDOM();
            await auth.init();

            // Already logged in? Redirect
            if (auth.isAuthenticated()) {
                const params = new URLSearchParams(window.location.search);
                window.location.href = params.get('returnTo') || '../dashboard.html';
            }

            // Check for messages
            const params = new URLSearchParams(window.location.search);
            if (params.get('registered')) {
                showSuccess(i18n.t('auth.check_email'));
            }
            if (params.get('reset')) {
                showSuccess(i18n.t('auth.password_reset_sent'));
            }
        });

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = '...';
            hideMessages();

            try {
                await auth.signIn(email, password);
                const params = new URLSearchParams(window.location.search);
                window.location.href = params.get('returnTo') || '../dashboard.html';
            } catch (error) {
                showError(error.message || i18n.t('auth.login_error'));
                submitBtn.disabled = false;
                submitBtn.textContent = i18n.t('auth.sign_in');
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.classList.add('show');
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMessage');
            el.textContent = msg;
            el.classList.add('show');
        }

        function hideMessages() {
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
        }
    </script>
</body>
</html>
