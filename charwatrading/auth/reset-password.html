<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password - Charwa Trading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #151514;
            --border-color: #252523;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #6b6b6b;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --danger: #ef4444;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container { width: 100%; max-width: 420px; padding: 20px; }
        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 24px; color: var(--text-primary); }
        .logo h1 span { color: var(--accent); }
        .logo p { font-size: 14px; color: var(--text-muted); margin-top: 8px; }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block; font-size: 14px; font-weight: 500;
            color: var(--text-secondary); margin-bottom: 8px;
        }
        .form-input {
            width: 100%; padding: 12px 16px;
            background: var(--bg-primary); border: 1px solid var(--border-color);
            border-radius: 6px; color: var(--text-primary);
            font-size: 14px; font-family: inherit; transition: border-color 0.2s;
        }
        .form-input:focus { outline: none; border-color: var(--accent); }
        .btn {
            width: 100%; padding: 14px 24px;
            background: var(--accent); border: none; border-radius: 6px;
            color: var(--bg-primary); font-size: 14px; font-weight: 600;
            font-family: inherit; cursor: pointer; transition: background 0.2s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-message {
            background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger);
            color: var(--danger); padding: 12px; border-radius: 6px;
            font-size: 14px; margin-bottom: 20px; display: none;
        }
        .error-message.show { display: block; }
        .success-message {
            background: rgba(34, 197, 94, 0.1); border: 1px solid var(--accent);
            color: var(--accent); padding: 12px; border-radius: 6px;
            font-size: 14px; margin-bottom: 20px; display: none;
        }
        .success-message.show { display: block; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <h1>CHARWA <span>Trading</span></h1>
                <p data-i18n="auth.new_password_subtitle">Neues Passwort setzen</p>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="newPasswordForm" onsubmit="handleNewPassword(event)">
                <div class="form-group">
                    <label class="form-label" for="password" data-i18n="auth.new_password">Neues Passwort</label>
                    <input type="password" id="password" class="form-input" placeholder="Min. 6 Zeichen" required minlength="6" autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="passwordConfirm" data-i18n="auth.password_confirm">Passwort best&auml;tigen</label>
                    <input type="password" id="passwordConfirm" class="form-input" required minlength="6">
                </div>
                <button type="submit" class="btn" id="submitBtn" data-i18n="auth.set_password">Passwort setzen</button>
            </form>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            i18n.setLanguage(localStorage.getItem('charwa_lang') || 'de');
            i18n.updateDOM();
            await auth.init();
        });

        async function handleNewPassword(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const submitBtn = document.getElementById('submitBtn');

            document.getElementById('errorMessage').classList.remove('show');

            if (password !== passwordConfirm) {
                document.getElementById('errorMessage').textContent = i18n.t('auth.passwords_mismatch');
                document.getElementById('errorMessage').classList.add('show');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '...';

            try {
                await auth.updatePassword(password);
                document.getElementById('successMessage').textContent = i18n.t('auth.password_updated');
                document.getElementById('successMessage').classList.add('show');
                document.getElementById('newPasswordForm').style.display = 'none';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                document.getElementById('errorMessage').textContent = error.message;
                document.getElementById('errorMessage').classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = i18n.t('auth.set_password');
            }
        }
    </script>
</body>
</html>
