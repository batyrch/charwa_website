<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe - Charwa Trading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #151514;
            --bg-card: #151514;
            --border-color: #252523;
            --border-light: #1f1f1d;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #6b6b6b;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --accent-glow: rgba(34, 197, 94, 0.25);
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-family); font-size: 16px; line-height: 1.5; color: var(--text-secondary); background: var(--bg-primary); min-height: 100vh; }
        h1, h2, h3, h4 { color: var(--text-primary); letter-spacing: -0.02em; }
        a { color: inherit; text-decoration: none; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 16px; }

        .header { position: sticky; top: 0; background: var(--bg-primary); border-bottom: 1px solid var(--border-color); z-index: 1000; }
        .header-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }
        .logo { font-size: 24px; font-weight: 700; color: var(--text-primary); }
        .logo span { color: var(--accent); }
        .nav { display: flex; align-items: center; gap: 32px; }
        .nav-links { display: flex; gap: 32px; list-style: none; }
        .nav-links a { color: var(--text-secondary); font-size: 14px; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover { color: var(--text-primary); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; padding: 12px 24px; border-radius: 6px; border: none; cursor: pointer; transition: all 0.2s; text-decoration: none; }
        .btn-primary { background: var(--accent); color: var(--bg-primary); }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-primary); }
        .btn-secondary:hover { background: var(--border-color); }
        .btn-sm { padding: 8px 16px; font-size: 13px; }

        .page-header { padding: 48px 0; text-align: center; border-bottom: 1px solid var(--border-color); margin-bottom: 48px; }
        .page-header h1 { font-size: 32px; margin-bottom: 8px; }
        .page-header p { color: var(--text-muted); font-size: 18px; }

        .subscribe-layout { display: grid; grid-template-columns: 1fr 340px; gap: 32px; padding-bottom: 64px; }

        /* Marketplace selection grid */
        .mp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .mp-card {
            background: var(--bg-card); border: 2px solid var(--border-color);
            border-radius: 12px; padding: 20px; cursor: pointer;
            transition: all 0.2s; position: relative;
        }
        .mp-card:hover { border-color: var(--text-muted); }
        .mp-card.selected { border-color: var(--accent); background: rgba(34, 197, 94, 0.05); }
        .mp-card.already-subscribed { opacity: 0.5; cursor: not-allowed; }
        .mp-check {
            position: absolute; top: 12px; right: 12px;
            width: 24px; height: 24px; border-radius: 6px;
            border: 2px solid var(--border-color); display: flex;
            align-items: center; justify-content: center; transition: all 0.2s;
        }
        .mp-card.selected .mp-check { background: var(--accent); border-color: var(--accent); }
        .mp-check svg { width: 16px; height: 16px; color: var(--bg-primary); opacity: 0; transition: opacity 0.2s; }
        .mp-card.selected .mp-check svg { opacity: 1; }
        .mp-name { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
        .mp-country { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .mp-meta { display: flex; justify-content: space-between; align-items: center; }
        .mp-listings { font-size: 13px; color: var(--text-muted); }
        .mp-price { font-size: 16px; font-weight: 700; color: var(--accent); }
        .mp-price-period { font-size: 11px; color: var(--text-muted); font-weight: 400; }

        /* Summary sidebar */
        .summary-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 24px; position: sticky; top: 104px;
        }
        .summary-title { font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: 16px; }
        .summary-items { margin-bottom: 16px; }
        .summary-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-light); font-size: 14px; }
        .summary-item:last-child { border-bottom: none; }
        .summary-empty { text-align: center; padding: 24px 0; color: var(--text-muted); font-size: 14px; }
        .summary-total { display: flex; justify-content: space-between; padding: 16px 0; border-top: 2px solid var(--border-color); margin-top: 8px; }
        .summary-total-label { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .summary-total-value { font-size: 20px; font-weight: 700; color: var(--accent); }
        .summary-total-period { font-size: 12px; color: var(--text-muted); font-weight: 400; }

        .footer { background: var(--bg-secondary); border-top: 1px solid var(--border-color); padding: 32px 0; margin-top: 64px; }
        .footer-inner { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted); }
        .footer-links { display: flex; gap: 24px; }
        .footer-links a { color: var(--text-muted); }
        .footer-links a:hover { color: var(--accent); }

        @media (max-width: 968px) {
            .subscribe-layout { grid-template-columns: 1fr; }
            .summary-card { position: static; }
            .nav-links { display: none; }
        }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 968px) {
            .subscribe-layout { grid-template-columns: 1fr; }
            .summary-card { position: static; }
            .nav-links { display: none; }
        }
        @media (max-width: 640px) {
            .mp-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">CHARWA <span>Trading</span></a>
            <nav class="nav">
                <ul class="nav-links">
                    <li><a href="index.html" data-i18n="nav.trucks">Fahrzeuge</a></li>
                    <li><a href="browse.html" data-i18n="nav.marketplace">Marktplatz</a></li>
                    <li><a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a></li>
                </ul>
            </nav>
            <a href="auth/login.html" class="btn btn-secondary btn-sm auth-nav-link" data-i18n="nav.login">Anmelden</a>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1 data-i18n="subscribe.title">Marktpl&auml;tze abonnieren</h1>
            <p data-i18n="subscribe.subtitle">W&auml;hlen Sie die Marktpl&auml;tze aus, deren Inserate Sie durchsuchen m&ouml;chten</p>
        </div>

        <div class="subscribe-layout">
            <div>
                <div class="mp-grid" id="marketplaceGrid">
                    <div style="grid-column: 1 / -1; text-align: center; padding: 48px; color: var(--text-muted);">
                        <div class="loading-spinner" style="width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
                        <p data-i18n="status.loading">Laden...</p>
                    </div>
                </div>
            </div>

            <aside>
                <div class="summary-card">
                    <div class="summary-title" data-i18n="subscribe.summary">Zusammenfassung</div>
                    <div class="summary-items" id="summaryItems">
                        <div class="summary-empty" data-i18n="subscribe.select_hint">W&auml;hlen Sie Marktpl&auml;tze aus</div>
                    </div>
                    <div class="summary-total" id="summaryTotal" style="display: none;">
                        <span class="summary-total-label" data-i18n="subscribe.total">Gesamt</span>
                        <span>
                            <span class="summary-total-value" id="totalPrice">&euro;0.00</span>
                            <span class="summary-total-period" data-i18n="subscribe.per_month">/Monat</span>
                        </span>
                    </div>
                    <button class="btn btn-primary" style="width: 100%; margin-top: 16px;" id="checkoutBtn" onclick="handleCheckout()" disabled data-i18n="subscribe.checkout">Zur Kasse</button>
                </div>
            </aside>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <p data-i18n="footer.copyright">&copy; 2026 Charwa GmbH</p>
            <div class="footer-links">
                <a href="https://charwa.de/impressum.html" data-i18n="footer.impressum">Impressum</a>
                <a href="https://charwa.de/privacy.html" data-i18n="footer.privacy">Datenschutz</a>
            </div>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/listings-api.js"></script>
    <script src="js/billing.js"></script>
    <script>
        let allMarketplaces = [];
        let selectedIds = new Set();
        let existingSubIds = new Set();

        document.addEventListener('DOMContentLoaded', async () => {
            i18n.setLanguage(localStorage.getItem('charwa_lang') || 'de');
            i18n.updateDOM();
            await auth.init();
            updateAuthNav();
            loadMarketplaces();
        });

        async function loadMarketplaces() {
            try {
                allMarketplaces = await listingsApi.getMarketplaces();

                // Check existing subscriptions if logged in
                if (auth.isAuthenticated()) {
                    const subs = await auth.getSubscriptions();
                    subs.forEach(s => {
                        if (s.is_active) existingSubIds.add(s.marketplace_id);
                    });
                }

                renderMarketplaces();
            } catch (error) {
                console.error('Failed to load marketplaces:', error);
            }
        }

        function renderMarketplaces() {
            const grid = document.getElementById('marketplaceGrid');
            grid.innerHTML = allMarketplaces.map(mp => {
                const isSubscribed = existingSubIds.has(mp.id);
                const isSelected = selectedIds.has(mp.id);
                return `
                    <div class="mp-card ${isSelected ? 'selected' : ''} ${isSubscribed ? 'already-subscribed' : ''}"
                         onclick="${isSubscribed ? '' : `toggleMarketplace('${mp.id}')`}"
                         data-id="${mp.id}">
                        <div class="mp-check">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                            </svg>
                        </div>
                        <div class="mp-name">${mp.name}</div>
                        <div class="mp-country">${mp.country}${isSubscribed ? ' &mdash; ' + i18n.t('subscribe.already_active') : ''}</div>
                        <div class="mp-meta">
                            <span class="mp-listings">${(mp.listing_count || 0).toLocaleString()} ${i18n.t('dashboard.listings')}</span>
                            <span class="mp-price">${billing.formatPrice(mp.price_cents)}<span class="mp-price-period">/${i18n.t('subscribe.month')}</span></span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleMarketplace(id) {
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
            } else {
                selectedIds.add(id);
            }
            renderMarketplaces();
            updateSummary();
        }

        function updateSummary() {
            const items = document.getElementById('summaryItems');
            const total = document.getElementById('summaryTotal');
            const btn = document.getElementById('checkoutBtn');
            const price = document.getElementById('totalPrice');

            if (selectedIds.size === 0) {
                items.innerHTML = `<div class="summary-empty" data-i18n="subscribe.select_hint">${i18n.t('subscribe.select_hint')}</div>`;
                total.style.display = 'none';
                btn.disabled = true;
                return;
            }

            const selected = allMarketplaces.filter(m => selectedIds.has(m.id));
            items.innerHTML = selected.map(mp => `
                <div class="summary-item">
                    <span>${mp.name}</span>
                    <span style="color: var(--text-primary);">${billing.formatPrice(mp.price_cents)}</span>
                </div>
            `).join('');

            const totalCents = billing.calculateTotal(allMarketplaces, [...selectedIds]);
            price.textContent = billing.formatPrice(totalCents);
            total.style.display = 'flex';
            btn.disabled = false;
        }

        async function handleCheckout() {
            if (!auth.isAuthenticated()) {
                window.location.href = 'auth/login.html?returnTo=' + encodeURIComponent(window.location.href);
                return;
            }

            const btn = document.getElementById('checkoutBtn');
            btn.disabled = true;
            btn.textContent = '...';

            try {
                await billing.createCheckout([...selectedIds]);
            } catch (error) {
                alert(error.message);
                btn.disabled = false;
                btn.textContent = i18n.t('subscribe.checkout');
            }
        }
    </script>
</body>
</html>
