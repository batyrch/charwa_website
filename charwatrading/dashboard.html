<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Charwa Trading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #151514;
            --bg-card: #151514;
            --border-color: #252523;
            --border-light: #1f1f1d;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #6b6b6b;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --accent-glow: rgba(34, 197, 94, 0.25);
            --warning: #f59e0b;
            --danger: #ef4444;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: var(--font-family); font-size: 16px; line-height: 1.5; color: var(--text-secondary); background: var(--bg-primary); min-height: 100vh; }
        h1, h2, h3, h4 { color: var(--text-primary); letter-spacing: -0.02em; }
        a { color: inherit; text-decoration: none; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 16px; }

        /* Header */
        .header { position: sticky; top: 0; background: var(--bg-primary); border-bottom: 1px solid var(--border-color); z-index: 1000; }
        .header-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }
        .logo { font-size: 24px; font-weight: 700; color: var(--text-primary); }
        .logo span { color: var(--accent); }
        .nav { display: flex; align-items: center; gap: 32px; }
        .nav-links { display: flex; gap: 32px; list-style: none; }
        .nav-links a { color: var(--text-secondary); font-size: 14px; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover { color: var(--text-primary); }
        .nav-links a.active { color: var(--accent); }
        .user-menu { display: flex; align-items: center; gap: 12px; }
        .user-menu-name { font-size: 14px; color: var(--text-secondary); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; transition: all 0.2s; text-decoration: none; }
        .btn-primary { background: var(--accent); color: var(--bg-primary); }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-primary); }
        .btn-secondary:hover { background: var(--border-color); }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); }
        .btn-outline:hover { background: var(--bg-secondary); }
        .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }
        .btn-sm { padding: 8px 16px; font-size: 13px; }

        /* Page header */
        .page-header { padding: 32px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 32px; }
        .page-header h1 { font-size: 28px; margin-bottom: 4px; }
        .page-header p { color: var(--text-muted); }

        /* Stats grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
        .stat-label { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--text-primary); }
        .stat-value.accent { color: var(--accent); }

        /* Sections */
        .section { margin-bottom: 32px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-header h2 { font-size: 20px; }

        /* Marketplace cards */
        .marketplace-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .marketplace-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; transition: border-color 0.2s; }
        .marketplace-card:hover { border-color: var(--accent); }
        .marketplace-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .marketplace-name { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .marketplace-country { font-size: 12px; color: var(--text-muted); }
        .marketplace-badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .badge-active { background: rgba(34, 197, 94, 0.15); color: var(--accent); }
        .marketplace-stats { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; }
        .marketplace-stats span { color: var(--text-muted); }
        .marketplace-stats strong { color: var(--text-primary); }

        /* Account section */
        .account-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; }
        .account-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-light); }
        .account-row:last-child { border-bottom: none; }
        .account-label { font-size: 14px; color: var(--text-muted); }
        .account-value { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .subscription-status { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .status-active { background: rgba(34, 197, 94, 0.15); color: var(--accent); }
        .status-inactive { background: rgba(107, 107, 107, 0.15); color: var(--text-muted); }
        .status-past_due { background: rgba(245, 158, 11, 0.15); color: var(--warning); }

        /* Loading */
        .loading-state { text-align: center; padding: 64px 24px; color: var(--text-muted); }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Footer */
        .footer { background: var(--bg-secondary); border-top: 1px solid var(--border-color); padding: 32px 0; margin-top: 64px; }
        .footer-inner { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted); }
        .footer-links { display: flex; gap: 24px; }
        .footer-links a { color: var(--text-muted); transition: color 0.2s; }
        .footer-links a:hover { color: var(--accent); }

        @media (max-width: 1200px) { .marketplace-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 968px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .nav-links { display: none; }
        }
        @media (max-width: 640px) {
            .stats-grid { grid-template-columns: 1fr; }
            .marketplace-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">CHARWA <span>Trading</span></a>
            <nav class="nav">
                <ul class="nav-links">
                    <li><a href="index.html" data-i18n="nav.trucks">Fahrzeuge</a></li>
                    <li><a href="browse.html" data-i18n="nav.marketplace">Marktplatz</a></li>
                    <li><a href="dashboard.html" class="active" data-i18n="nav.dashboard">Dashboard</a></li>
                </ul>
            </nav>
            <div class="user-menu">
                <span class="user-menu-name" id="userName"></span>
                <button class="btn btn-secondary btn-sm" onclick="handleSignOut()" data-i18n="auth.sign_out">Abmelden</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1 data-i18n="dashboard.title">Dashboard</h1>
            <p data-i18n="dashboard.subtitle">Ihre Marktplatz-Abonnements und Daten&uuml;bersicht</p>
        </div>

        <div id="dashboardContent">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p data-i18n="status.loading">Laden...</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <p data-i18n="footer.copyright">&copy; 2026 Charwa GmbH</p>
            <div class="footer-links">
                <a href="https://charwa.de/impressum.html" data-i18n="footer.impressum">Impressum</a>
                <a href="https://charwa.de/privacy.html" data-i18n="footer.privacy">Datenschutz</a>
            </div>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/listings-api.js"></script>
    <script src="js/billing.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            i18n.setLanguage(localStorage.getItem('charwa_lang') || 'de');
            i18n.updateDOM();
            await auth.init();

            if (!auth.isAuthenticated()) {
                window.location.href = 'auth/login.html?returnTo=' + encodeURIComponent(window.location.href);
                return;
            }

            document.getElementById('userName').textContent = auth.getUser()?.email || '';
            loadDashboard();
        });

        async function loadDashboard() {
            try {
                const [subscriptionInfo, marketplaces] = await Promise.all([
                    billing.getSubscriptionInfo(),
                    listingsApi.getMarketplaces()
                ]);

                const profile = await auth.getProfile();
                const activeCount = subscriptionInfo.marketplaces.filter(m => m.is_active).length;
                const totalListings = subscriptionInfo.marketplaces.reduce((sum, m) => {
                    const mp = marketplaces.find(x => x.id === m.id);
                    return sum + (mp?.listing_count || 0);
                }, 0);

                document.getElementById('dashboardContent').innerHTML = `
                    <!-- Stats -->
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label" data-i18n="dashboard.active_subs">${i18n.t('dashboard.active_subs')}</div>
                            <div class="stat-value accent">${activeCount}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label" data-i18n="dashboard.total_listings">${i18n.t('dashboard.total_listings')}</div>
                            <div class="stat-value">${totalListings.toLocaleString()}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label" data-i18n="dashboard.available_markets">${i18n.t('dashboard.available_markets')}</div>
                            <div class="stat-value">${marketplaces.length}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label" data-i18n="dashboard.status">${i18n.t('dashboard.status')}</div>
                            <div class="stat-value">
                                <span class="subscription-status status-${subscriptionInfo.status}">
                                    ${subscriptionInfo.status === 'active' ? i18n.t('dashboard.status_active') : subscriptionInfo.status === 'past_due' ? i18n.t('dashboard.status_past_due') : i18n.t('dashboard.status_inactive')}
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Subscribed Marketplaces -->
                    <div class="section">
                        <div class="section-header">
                            <h2 data-i18n="dashboard.your_marketplaces">${i18n.t('dashboard.your_marketplaces')}</h2>
                            <div style="display: flex; gap: 8px;">
                                <a href="browse.html" class="btn btn-primary btn-sm" data-i18n="dashboard.browse_listings">${i18n.t('dashboard.browse_listings')}</a>
                                <a href="subscribe.html" class="btn btn-secondary btn-sm" data-i18n="dashboard.add_marketplace">${i18n.t('dashboard.add_marketplace')}</a>
                            </div>
                        </div>

                        ${activeCount > 0 ? `
                            <div class="marketplace-grid">
                                ${subscriptionInfo.marketplaces.filter(m => m.is_active).map(sub => {
                                    const mp = marketplaces.find(x => x.id === sub.id);
                                    return `
                                        <div class="marketplace-card">
                                            <div class="marketplace-card-header">
                                                <div>
                                                    <div class="marketplace-name">${mp?.name || sub.name}</div>
                                                    <div class="marketplace-country">${mp?.country || ''}</div>
                                                </div>
                                                <span class="marketplace-badge badge-active">${i18n.t('dashboard.active')}</span>
                                            </div>
                                            <div class="marketplace-stats">
                                                <span>${i18n.t('dashboard.listings')}: <strong>${(mp?.listing_count || 0).toLocaleString()}</strong></span>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        ` : `
                            <div style="text-align: center; padding: 48px 24px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;">
                                <p style="color: var(--text-muted); margin-bottom: 16px;" data-i18n="dashboard.no_subscriptions">${i18n.t('dashboard.no_subscriptions')}</p>
                                <a href="subscribe.html" class="btn btn-primary" data-i18n="dashboard.subscribe_now">${i18n.t('dashboard.subscribe_now')}</a>
                            </div>
                        `}
                    </div>

                    <!-- Account -->
                    <div class="section">
                        <div class="section-header">
                            <h2 data-i18n="dashboard.account">${i18n.t('dashboard.account')}</h2>
                            <button class="btn btn-outline btn-sm" onclick="billing.openCustomerPortal()" data-i18n="dashboard.manage_billing">${i18n.t('dashboard.manage_billing')}</button>
                        </div>
                        <div class="account-card">
                            <div class="account-row">
                                <span class="account-label" data-i18n="auth.email">${i18n.t('auth.email')}</span>
                                <span class="account-value">${profile?.email || auth.getUser()?.email || ''}</span>
                            </div>
                            <div class="account-row">
                                <span class="account-label" data-i18n="auth.full_name">${i18n.t('auth.full_name')}</span>
                                <span class="account-value">${profile?.full_name || '-'}</span>
                            </div>
                            <div class="account-row">
                                <span class="account-label" data-i18n="auth.company">${i18n.t('auth.company')}</span>
                                <span class="account-value">${profile?.company_name || '-'}</span>
                            </div>
                            ${subscriptionInfo.current_period_end ? `
                                <div class="account-row">
                                    <span class="account-label" data-i18n="dashboard.next_billing">${i18n.t('dashboard.next_billing')}</span>
                                    <span class="account-value">${new Date(subscriptionInfo.current_period_end).toLocaleDateString()}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;

                i18n.updateDOM();

            } catch (error) {
                console.error('Dashboard load error:', error);
                document.getElementById('dashboardContent').innerHTML = `
                    <div class="loading-state">
                        <p>${i18n.t('status.error')}: ${error.message}</p>
                    </div>
                `;
            }
        }

        async function handleSignOut() {
            await auth.signOut();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
